<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="星語塔羅 — 互動塔羅占卜 Tarot of the Stars" />
<title>星語塔羅 · Tarot of the Stars</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%AE%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="./app.css?v=2" />
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand"><span class="logo">✦</span><div><h1 data-i18n="brand">星語塔羅</h1><small data-i18n="brand.sub">Tarot of the Stars</small></div></div>
  <button id="lang-btn" class="pill" type="button">EN</button>
</header>

<main>
  <!-- ═══ STEP 1 · SETUP ═══ -->
  <section id="step-setup" class="step">
    <h2 class="step-title" data-i18n="setup.title">靜下心，在心中默想一個問題</h2>
    <p class="step-hint" data-i18n="setup.hint">問題越具體，牌面越有方向。不輸入問題也可以。</p>
    <div class="field">
      <input id="question" type="text" maxlength="120" data-i18n-placeholder="setup.qPlaceholder" placeholder="你現在最想了解的是…？" aria-label="Question" />
    </div>
    <h3 class="field-label" data-i18n="setup.spread">選擇牌陣</h3>
    <div id="spread-opts" class="spread-opts" role="radiogroup" aria-label="Spread">
      <button type="button" class="spread-opt" data-spread="1">
        <span class="so-icon">🃏</span><b data-i18n="spread.1.name">單張指引</b>
        <small data-i18n="spread.1.desc">每日一牌，聚焦當下</small>
      </button>
      <button type="button" class="spread-opt active" data-spread="3">
        <span class="so-icon">🔮</span><b data-i18n="spread.3.name">三張牌陣</b>
        <small data-i18n="spread.3.desc">過去 · 現在 · 未來</small>
      </button>
      <button type="button" class="spread-opt" data-spread="5">
        <span class="so-icon">🌌</span><b data-i18n="spread.5.name">五張十字</b>
        <small data-i18n="spread.5.desc">現況 · 挑戰 · 根基 · 發展 · 建議</small>
      </button>
    </div>
    <label class="toggle-row">
      <input id="rev-toggle" type="checkbox" checked />
      <span class="toggle-track" aria-hidden="true"></span>
      <span data-i18n="setup.reversed">允許逆位（部分牌會倒轉）</span>
    </label>
    <button id="start-btn" class="primary" type="button" data-i18n="setup.start">✦ 開始洗牌</button>
  </section>

  <!-- ═══ STEP 2 · SHUFFLE ═══ -->
  <section id="step-shuffle" class="step" hidden>
    <h2 class="step-title" data-i18n="shuffle.title">專注於你的問題，洗牌中…</h2>
    <div id="shuffle-stage" class="shuffle-stage" aria-label="Shuffling deck"></div>
    <button id="stop-btn" class="primary" type="button" data-i18n="shuffle.stop">停止洗牌</button>
    <p class="step-hint" data-i18n="shuffle.hint">準備好就按「停止洗牌」，牌會自動抽出。</p>
  </section>

  <!-- ═══ STEP 3 · DRAW + READING ═══ -->
  <section id="step-draw" class="step" hidden>
    <h2 class="step-title" data-i18n="draw.title">請逐張翻開你的牌</h2>
    <div id="draw-grid" class="draw-grid"></div>
    <div id="draw-cta" class="draw-cta" hidden>
      <button id="view-reading-btn" class="primary" type="button" data-i18n="draw.reading">查看完整解讀</button>
    </div>
    <div id="reading-list" class="reading-list"></div>
    <div id="reading-footer" hidden>
      <div id="deep-wrap" class="deep-wrap">
        <button id="deep-btn" class="primary" type="button" data-i18n="deep.btn">✦ AI 深度解讀</button>
        <p class="step-hint" data-i18n="deep.hint">由 AI 綜合整副牌陣撰寫更長的解讀（可選）</p>
        <div id="deep-out" class="deep-out" hidden></div>
      </div>
      <button id="again-btn" class="primary ghost" type="button" data-i18n="draw.again">✦ 再占一次</button>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p data-i18n="footer.credit">牌面：Rider-Waite 塔羅牌（公有領域）· 解讀：參考 Tarotoo 開源資料集及《Pictorial Key to the Tarot》</p>
  <p data-i18n="footer.disclaimer">占卜結果僅供娛樂參考，不構成任何專業建議。</p>
</footer>

<script>
window.DECK_SRC = "./deck.json";
</script>
<script src="./app.js?v=2" defer></script>
</body>
</html>
